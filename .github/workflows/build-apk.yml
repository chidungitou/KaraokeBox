# Tự build APK Karaoke Box mỗi khi NewPipeExtractor có bản mới (hoặc khi bạn đẩy code / bấm chạy tay),
# rồi đăng lên GitHub Releases với tên file cố định để tải thẳng về box:
#   https://github.com/<tài-khoản>/<repo>/releases/latest/download/KaraokeBox.apk
# Hướng dẫn thiết lập một lần (khoá ký, cách cài lên box): xem mục "Tự build APK" trong UPDATE_YOUTUBE.md.
name: Build APK

on:
  schedule:
    - cron: '17 3 * * *'        # mỗi ngày 03:17 UTC (10:17 giờ Việt Nam). Có bản NewPipe mới thì build, không thì bỏ qua trong ~1 phút
  workflow_dispatch:
    inputs:
      newpipe_version:
        description: 'Ép dùng bản NewPipeExtractor này (vd v0.27.0). Để trống = bản mới nhất trên GitHub'
        required: false
      force:
        description: 'Build lại và ghi đè release dù đã có'
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write                # cần để tạo release

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Quyết định có cần build không
        id: ver
        env:
          INPUT_NP: ${{ github.event.inputs.newpipe_version }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          APP=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          PINNED=$(grep -oP '^newpipeVersion=\K\S+' gradle.properties)
          LATEST="${INPUT_NP:-}"
          if [ -z "$LATEST" ]; then
            LATEST=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name 2>/dev/null || true)
          fi
          LATEST="${LATEST:-$PINNED}"
          SKIP=false
          # Chạy theo lịch mà đã có bản build cho đúng cặp (phiên bản app, NewPipe) này thì khỏi làm lại
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "v${APP}-np-${LATEST}" >/dev/null 2>&1; then
            SKIP=true
          fi
          {
            echo "app=$APP"; echo "pinned=$PINNED"; echo "latest=$LATEST"; echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "App $APP | NewPipeExtractor mới nhất $LATEST | đang ghim $PINNED | bỏ qua: $SKIP"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          gradle-version: '8.2'

      - name: Khôi phục khoá ký
        if: steps.ver.outputs.skip != 'true'
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "SIGNED=mine" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có secret DEBUG_KEYSTORE_BASE64: APK sẽ ký bằng khoá tạm của máy chủ, KHÔNG cài đè được lên bản đang chạy trên box (phải gỡ rồi cài lại, mất hàng chờ và cài đặt). Xem UPDATE_YOUTUBE.md."
            echo "SIGNED=runner" >> "$GITHUB_ENV"
          fi

      - name: Chấp nhận giấy phép Android SDK
        if: steps.ver.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Chạy test
        if: steps.ver.outputs.skip != 'true'
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK (thử bản NewPipe mới nhất, lỗi thì lùi về bản đang ghim)
        id: build
        if: steps.ver.outputs.skip != 'true'
        run: |
          set -uo pipefail
          USED=""
          TRIED=" "
          for NP in "${{ steps.ver.outputs.latest }}" "${{ steps.ver.outputs.pinned }}"; do
            case "$TRIED" in *" $NP "*) continue ;; esac
            TRIED="$TRIED$NP "
            echo "::group::Build với NewPipeExtractor $NP"
            if gradle assembleDebug -PnewpipeVersion="$NP" --no-daemon --stacktrace; then
              USED="$NP"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "::warning::Build với NewPipeExtractor $NP thất bại (JitPack chưa dựng xong, hoặc thư viện đổi API)"
          done
          if [ -z "$USED" ]; then
            echo "::error::Không bản NewPipeExtractor nào build được"
            exit 1
          fi
          echo "used=$USED" >> "$GITHUB_OUTPUT"

      - name: Đăng lên GitHub Releases
        if: steps.ver.outputs.skip != 'true'
        env:
          APP: ${{ steps.ver.outputs.app }}
          USED: ${{ steps.build.outputs.used }}
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          TAG="v${APP}-np-${USED}"
          cp app/build/outputs/apk/debug/app-debug.apk KaraokeBox.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Đã có release $TAG, không làm lại"; exit 0
            fi
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          NOTES="Karaoke Box ${APP}, NewPipeExtractor ${USED}."
          if [ "$USED" != "$LATEST" ]; then
            NOTES="$NOTES"$'\n\n'"Bản NewPipeExtractor mới nhất là ${LATEST} nhưng build với bản đó thất bại nên dùng ${USED}. Workflow sẽ tự thử lại hằng ngày."
          fi
          if [ "${SIGNED:-}" = "runner" ]; then
            NOTES="$NOTES"$'\n\n'"⚠ APK này ký bằng khoá tạm, không cài đè được lên bản cũ trên box (xem UPDATE_YOUTUBE.md)."
          fi
          gh release create "$TAG" KaraokeBox.apk \
            --target "${{ github.sha }}" \
            --title "Karaoke Box ${APP} (NewPipe ${USED})" \
            --notes "$NOTES" \
            --latest
